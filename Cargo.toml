[package]
name = "motorola-receiver"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Experimental independent Motorola camera receiver and account client"
default-run = "motorola-receiver"

[lib]
name = "motorola_receiver"
path = "src/lib.rs"

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
md-5 = "0.10.6"
getrandom = "0.2.16"
simple-rijndael = "=0.3.2"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

rtsp-types = "0.1.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
